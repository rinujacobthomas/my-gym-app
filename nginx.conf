# openGym web — one origin for everything (required for OAuth cookies).
#
# Serves THREE Vite bundles built with base:'./' (relative asset URLs), so each
# bundle works under its URL prefix as long as index.html lives at that prefix:
#
#   /            → member PWA     (html/app, HashRouter)
#   /coach/*     → trainer app    (html/coach)
#   /admin/*     → admin app      (html/admin)
#   /img/, /gif/ → exercise media (mounted from host ./media by compose)
#   /api/*       → proxied to the NestJS API (global prefix 'api', preserved)
#
# ^~ prefix modifiers are deliberate: they beat regex locations, so hashed
# assets under /coach/assets etc. don't get captured by the extension rules
# below with the wrong root.

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- API ----
    # proxy_pass WITHOUT a URI part preserves the full original path:
    # /api/health → http://api:3000/api/health (matches Nest globalPrefix 'api')
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- media ----
    # Immutable exercise images/GIFs (~140 MB) — mounted read-only by compose.
    location ^~ /img/ {
        root /usr/share/nginx/media;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /gif/ {
        root /usr/share/nginx/media;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------ coach ----
    location ^~ /coach/assets/ {
        root /usr/share/nginx/html;          # URI /coach/assets/x → html/coach/assets/x
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";  # vite-hashed
    }
    location = /coach/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";            # shell revalidates
    }
    location ^~ /coach/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /coach/index.html;                          # SPA fallback
    }

    # ------------------------------------------------------------ admin ----
    location ^~ /admin/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /admin/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ^~ /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ------------------------------------------------------ member PWA ----
    # Service worker must always revalidate so updates activate immediately.
    location = /sw.js {
        root /usr/share/nginx/html/app;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ^~ /assets/ {
        root /usr/share/nginx/html/app;      # URI /assets/x → html/app/assets/x
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /app/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        root /usr/share/nginx/html/app;
        try_files $uri $uri/ /app/index.html;
    }
}
